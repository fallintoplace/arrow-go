# Temporary branch-only benchmark workflow; removed after collecting paired results.
name: RLE packed levels benchmark
on:
  push:
    branches:
      - perf/parquet-rle-packed-levels-20261024
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test ./parquet/internal/utils -run '^TestRleBatchLevelsPacked' -count=1
      - name: Paired benchmarks
        run: GOMAXPROCS=1 go test ./parquet/internal/utils -run '^$' -bench '^BenchmarkRleBatchLevelsPacked' -benchmem -benchtime=100ms -count=5 -cpu=1

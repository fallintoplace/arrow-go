name: Bitmap equality before-after benchmark
on:
  push:
    branches: [perf/bitmap-equals-packed-20261024]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare base and head on one runner
        shell: bash
        run: |
          set -euo pipefail
          cp arrow/bitutil/bitmap_equals_offsets_benchmark_test.go "$RUNNER_TEMP/bitmap_equals_offsets_benchmark_test.go"
          git checkout 2440af8a4d1b87f5e424d5c0c5f83959a9aebdb3
          cp "$RUNNER_TEMP/bitmap_equals_offsets_benchmark_test.go" arrow/bitutil/bitmap_equals_offsets_benchmark_test.go
          GOMAXPROCS=1 go test ./arrow/bitutil -run '^$' -bench '^BenchmarkBitmapEqualsOffsets$' -benchtime=150ms -count=5 -cpu=1 -benchmem > "$RUNNER_TEMP/before.txt"
          rm arrow/bitutil/bitmap_equals_offsets_benchmark_test.go
          git checkout "$GITHUB_SHA"
          GOMAXPROCS=1 go test ./arrow/bitutil -run '^$' -bench '^BenchmarkBitmapEqualsOffsets$' -benchtime=150ms -count=5 -cpu=1 -benchmem > "$RUNNER_TEMP/after.txt"
          echo 'BASE BENCHMARK RESULTS'
          cat "$RUNNER_TEMP/before.txt"
          echo 'HEAD BENCHMARK RESULTS'
          cat "$RUNNER_TEMP/after.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bitmap-equals-bench-results
          path: |
            ${{ runner.temp }}/before.txt
            ${{ runner.temp }}/after.txt
